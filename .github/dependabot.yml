version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      core-runtime:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /packages/admin
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      admin-runtime:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /packages/api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /packages/admin
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    labels:
      - dependencies
