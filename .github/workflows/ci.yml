name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs on a self-hosted runner on the Hetzner box (no GitHub minutes).
# Postgres is the box's native instance on :5433 (no Docker on the runner).
# Secrets (DATABASE_URL, PGPASSWORD) come from the runner's own .env file,
# so they are never committed to the repo.
jobs:
  build-test:
    runs-on: [self-hosted, linux]

    steps:
      - uses: actions/checkout@v4

      - name: pnpm via corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck

      - name: reset throwaway CI database
        run: |
          psql -h 127.0.0.1 -p 5433 -U sellright -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sellright_ci;" \
            -c "CREATE DATABASE sellright_ci OWNER sellright;"

      - name: migrate + RLS test (against sellright_ci)
        run: |
          pnpm --filter @sellright/api db:migrate
          pnpm --filter @sellright/api test
