name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.25.0
  NODE_LTS: 24.20.0

jobs:
  ios-model-contracts:
    name: iOS model contracts
    runs-on: macos-15
    timeout-minutes: 10
    # Foundation/Observation models only; this does not build UI or App targets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Foundation/Observation model contracts
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d "$RUNNER_TEMP/sellright-ios-model-contracts.XXXXXX")"
          mkdir -p "$package_dir/Sources/SellRightAdmin" "$package_dir/Tests/SellRightAdminTests"
          cp ios/SellRightAdmin/Core/Models.swift "$package_dir/Sources/SellRightAdmin/Models.swift"
          cp ios/Shared/Money.swift "$package_dir/Sources/SellRightAdmin/Money.swift"
          cp ios/Tests/ModelsTests.swift "$package_dir/Tests/SellRightAdminTests/ModelsTests.swift"
          cmp ios/SellRightAdmin/Core/Models.swift "$package_dir/Sources/SellRightAdmin/Models.swift"
          cmp ios/Shared/Money.swift "$package_dir/Sources/SellRightAdmin/Money.swift"
          cmp ios/Tests/ModelsTests.swift "$package_dir/Tests/SellRightAdminTests/ModelsTests.swift"
          cat > "$package_dir/Package.swift" <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "SellRightAdminModelContracts",
              platforms: [.macOS(.v14)],
              targets: [
                  .target(name: "SellRightAdmin"),
                  .testTarget(name: "SellRightAdminTests", dependencies: ["SellRightAdmin"]),
              ],
              swiftLanguageVersions: [.v5]
          )
          SWIFT
          swift test --package-path "$package_dir" --scratch-path "$package_dir/.build"

  storefront:
    # Retains the protected branch's storefront check for the isolated demo
    # consumer. Production merchant storefronts remain downstream.
    name: Storefront build / Node 24 LTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}
      - name: Check demo consumer and safety boundary
        run: |
          node --check deploy/demo/shop.js
          node --check deploy/demo/server.mjs
          node --check deploy/demo/interactive-server.mjs
          node --check deploy/demo/run-storefront.mjs
          node --check deploy/demo/demo-admin.js
          node --check deploy/demo/visitors.mjs
          node --test deploy/demo/*.test.mjs
          node --test deploy/package-portable-runtime.test.mjs
          node --test deploy/package-portable-frontend.test.mjs

  verify:
    name: Core + admin / Node 24 LTS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@e0ed22ae4d909f13ed5d2688513f73e1875e46db # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
          # pnpm/setup v3 would otherwise install Node from .nvmrc; setup-node owns Node here.
          node-version-file: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/admin/pnpm-lock.yaml

      - name: Install core workspace
        run: pnpm install --frozen-lockfile

      - name: Restore archive staging regressions
        run: node deploy/tests/test-restore-staging.mjs

      - name: Install admin
        run: pnpm --dir packages/admin install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm deps:audit

      - name: Production build (root — the storefront's full production build; no page is prerendered any more)
        id: production_build
        # The exact command a real deploy runs: `pnpm -r build` (every
        # workspace package's own `build` script, including packages/
        # storefront's full production build) then
        # packages/admin's build. `pnpm verify:static` below also runs
        # `pnpm -r build`, but as one step inside a longer chain — this
        # dedicated step exists so a regression in the storefront's build path
        # (PR #96 shipped one: an intermittent Code(Q8) crash rendering
        # /checkout/ during static generation, since fixed by excluding
        # /checkout from SSG and hardening the runtime identity fetch —
        # see routes/layout.tsx, adapters/express/vite.config.mts) fails
        # here, unambiguously, on its own line — not silently inside a
        # bigger pipeline that happened to get lucky on a given run.
        run: pnpm build

      - name: Packed sample disposable DB guard
        run: pnpm --filter @sellright/sample-plugin exec vitest run test/packed-guard.test.ts

      - name: Verify core and admin
        id: verify_static
        run: pnpm verify:static

      - name: Generate client contract repair patch after failed verification
        id: contract_patch
        if: ${{ failure() && (steps.production_build.outcome == 'failure' || steps.verify_static.outcome == 'failure') }}
        run: |
          # Keep verification failed; export generator output for owner review, never auto-commit.
          pnpm --filter @sellright/storefront-client generate
          git diff --binary -- packages/storefront-client/openapi.json packages/storefront-client/src/generated/schema.d.ts > "$RUNNER_TEMP/storefront-client-generated.patch"
          if test -s "$RUNNER_TEMP/storefront-client-generated.patch"; then
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated client contract repair patch
        if: ${{ failure() && steps.contract_patch.outputs.has_patch == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storefront-client-generated-${{ github.sha }}
          path: ${{ runner.temp }}/storefront-client-generated.patch
          if-no-files-found: error
          retention-days: 7

      - name: Password hashing contract
        run: pnpm --filter @sellright/api test src/auth/password.test.ts

      - name: Admin tests
        run: pnpm --dir packages/admin test

      - name: Storefront tests
        # `pnpm verify:static` above already builds and typechecks
        # packages/storefront via `pnpm -r build`/`pnpm -r typecheck` (it's a
        # normal workspace member — only packages/admin is excluded). This
        # adds the one thing that wasn't running anywhere in CI: the
        # storefront's own vitest suite (unit, then the Qwik render tests in vitest.render.config.ts).
        run: pnpm --filter @sellright/storefront test

      - name: Storefront tooling tests (layers, import and code-shape checks, brand-literal lint)
        # Plan A14/A19/A22: node --test over packages/storefront/scripts/*.test.mjs. They need the workspace install
        # above (the TypeScript compiler API); each builds its fixture project in a temp directory.
        run: pnpm --filter @sellright/storefront run test:scripts

      - name: Storefront layer checks (base)
        # layers.json must classify every src, public and adapters path without ambiguity; base L2 orchestration calls
        # are listed in report mode until A13 (layers.json codeShape.baseL2Enforcement); brand-literal lint warns until A20.
        run: |
          pnpm --filter @sellright/storefront run check:layers
          pnpm --filter @sellright/storefront run check:gateway
          pnpm --filter @sellright/storefront run check:shape:base
          pnpm --filter @sellright/storefront run lint:brand

      - name: Build verified demo frontend and admin
        run: |
          pnpm --filter @sellright/storefront build:demo
          SELLRIGHT_ADMIN_BASE_PATH=/admin VITE_ADMIN_BASE_PATH=/admin SELLRIGHT_BUILD_SUFFIX=demo pnpm --dir packages/admin build
          node packages/api/scripts/write-build-info.mjs packages/admin/dist-demo/BUILD-INFO.json

      - name: Package verified API and admin runtime
        run: |
          bundle="$RUNNER_TEMP/sellright-runtime"
          mkdir "$bundle"
          # Tests already passed; omit compiled test helpers & E2E fixtures from this runtime package.
          rm -f packages/api/dist/db/rls-test-utils.{js,js.map,d.ts} \
             packages/api/dist/db/test-database-url.{js,js.map,d.ts} \
             packages/api/dist/licensing/storekit/jws-fixture.{js,js.map,d.ts} \
             packages/api/dist/licensing/storekit/fork-reference-policy.kit.{js,js.map,d.ts} \
             packages/api/dist/payments/gateway-e2e-safety.{js,js.map,d.ts} \
             packages/api/dist/scripts/seed-e2e-catalog.{js,js.map,d.ts}
          find packages/api/dist -type f -name '*.testkit.*' -delete
          pnpm --filter @sellright/api pack --pack-destination "$bundle"
          node packages/api/scripts/write-build-info.mjs packages/admin/dist/BUILD-INFO.json
          python3 - <<'PY'
          import json, os, shutil, tarfile
          from pathlib import Path, PurePosixPath
          bundle = Path(os.environ['RUNNER_TEMP']) / 'sellright-runtime'
          sha = os.environ['GITHUB_SHA']
          def identity(info):
              assert info['sha'] == sha and info['dirty'] is False, 'runtime build identity mismatch'
          with tarfile.open(bundle / 'sellright-api-0.1.0.tgz', 'r:gz') as archive:
              names = set()
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts, 'unsafe package path'
                  assert path.parts[0] == 'package' and (member.isfile() or member.isdir()), 'unsafe package entry'
                  relative = path.parts[1:]
                  assert not relative or relative[0] in {'dist', 'drizzle', 'exports', 'package.json', 'BUILD-INFO.json', 'README.md', 'LICENSE', 'LICENSE.md', 'LICENSE.txt'}, 'unexpected package content'
                  assert not any(part.startswith('.') or part in {'node_modules', '__tests__', '__mocks__'} for part in relative), 'non-runtime package content'
                  assert not any(marker in member.name for marker in ('.test.', '.testkit.', '.spec.', 'rls-test-utils.', 'test-database-url.', 'jws-fixture.', 'fork-reference-policy.kit.', 'gateway-e2e-safety.', 'seed-e2e-catalog.')), 'test code in runtime package'
                  names.add(member.name)
              required = {'package/package.json', 'package/BUILD-INFO.json', 'package/dist/sdk/index.js', 'package/dist/sdk/index.d.ts', 'package/drizzle/meta/_journal.json', 'package/exports/contract.json'}
              assert required <= names, 'incomplete API runtime package'
              identity(json.load(archive.extractfile('package/BUILD-INFO.json')))
          admin = Path('packages/admin/dist')
          assert (admin / 'index.html').is_file() and (admin / 'admin-static').is_dir(), 'incomplete admin runtime'
          for path in admin.rglob('*'):
              assert not path.is_symlink() and (path.is_file() or path.is_dir()), 'unsafe admin entry'
              assert not any(part.startswith('.') or part in {'node_modules', '__tests__', '__mocks__'} for part in path.relative_to(admin).parts), 'non-runtime admin content'
          identity(json.loads((admin / 'BUILD-INFO.json').read_text()))
          shutil.copytree(admin, bundle / 'admin-dist')
          PY
          node deploy/package-portable-runtime.mjs "$bundle/sellright-api-0.1.0.tgz" "$bundle"

      - name: Package verified demo frontend runtime
        run: node deploy/package-portable-frontend.mjs "$RUNNER_TEMP/sellright-runtime"

      - name: Upload verified runtime bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sellright-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sellright-runtime/sellright-api-0.1.0.tgz
            ${{ runner.temp }}/sellright-runtime/admin-dist/
            ${{ runner.temp }}/sellright-runtime/api-runtime.tar.gz
            ${{ runner.temp }}/sellright-runtime/api-runtime-manifest.json
            ${{ runner.temp }}/sellright-runtime/demo-run.mjs
            ${{ runner.temp }}/sellright-runtime/frontend-runtime.tar.gz
            ${{ runner.temp }}/sellright-runtime/frontend-runtime-manifest.json
          if-no-files-found: error
          retention-days: 7

  database:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sellright_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_test
      DATABASE_URL_NONOWNER: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_test
      IMPORT_SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_import_source_test
      IMPORT_TARGET_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_import_target_test
      STOREFRONT_URL: https://shop.example.net
      DOWNLOAD_URL_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@e0ed22ae4d909f13ed5d2688513f73e1875e46db # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
          # pnpm/setup v3 would otherwise install Node from .nvmrc; setup-node owns Node here.
          node-version-file: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build API migration runtime
        run: pnpm --filter @sellright/shared build && pnpm --filter @sellright/api build

      - name: Apply migrations
        run: pnpm --filter @sellright/api db:migrate:runtime

      - name: Prepare isolated importer fixtures
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres sellright_import_source_test
          createdb -h 127.0.0.1 -U postgres sellright_import_target_test
          DATABASE_URL="$IMPORT_TARGET_DATABASE_URL" pnpm --filter @sellright/api db:migrate:runtime

      - name: Create non-owner RLS test role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sellright_test <<'SQL'
          CREATE ROLE sellright_app LOGIN PASSWORD 'sellright_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE sellright_test TO sellright_app;
          GRANT USAGE ON SCHEMA public TO sellright_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sellright_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sellright_app;
          SQL

      # SR-11: both lanes run with the service database — the unit lane must
      # stay green with a DB present (self-skipping suites execute their DB
      # cases here), and the db lane covers shared *_test suites selected by
      # vitest.config.ts. Fresh-install authorization has its own required lane.
      - name: Run unit lane
        run: pnpm --filter @sellright/api test

      - name: Run DB integration suite
        run: pnpm --filter @sellright/api test:db

      # B2.8 bootstrap precedes principal enrollment on an untouched installation.
      # This job owns its ephemeral service: create another DB, never reset shared suite state.
      - name: Provision fresh full-authorization database
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_authorization_matrix_test
          DATABASE_URL_NONOWNER: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_authorization_matrix_test
        run: |
          createdb -h 127.0.0.1 -U postgres sellright_authorization_matrix_test
          pnpm --filter @sellright/api db:migrate:runtime
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sellright_authorization_matrix_test <<'SQL'
          GRANT CONNECT ON DATABASE sellright_authorization_matrix_test TO sellright_app;
          GRANT USAGE ON SCHEMA public TO sellright_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sellright_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sellright_app;
          SQL

      - name: Full 345-route authorization matrix with genuine fresh-install bootstrap
        timeout-minutes: 25
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_authorization_matrix_test
          DATABASE_URL_NONOWNER: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_authorization_matrix_test
          AUTHORIZATION_MATRIX_EXPECTED_DATABASE: sellright_authorization_matrix_test
        run: pnpm --filter @sellright/api exec vitest run --project authorization-matrix

      # The enrolled-only regression suite inserts its own installation administrator, so it cannot follow the
      # qualified bootstrap in the same database: a second fresh database, never reset, never shared.
      - name: Provision fresh enrolled-only authorization database
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_authorization_enrolled_test
        run: |
          createdb -h 127.0.0.1 -U postgres sellright_authorization_enrolled_test
          pnpm --filter @sellright/api db:migrate:runtime
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sellright_authorization_enrolled_test <<'SQL'
          GRANT CONNECT ON DATABASE sellright_authorization_enrolled_test TO sellright_app;
          GRANT USAGE ON SCHEMA public TO sellright_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sellright_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sellright_app;
          SQL

      - name: Enrolled-only authorization regressions (343 contracts, genuine sessions)
        timeout-minutes: 25
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_authorization_enrolled_test
          DATABASE_URL_NONOWNER: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_authorization_enrolled_test
        run: pnpm --filter @sellright/api exec vitest run --project authorization-enrolled

      # PGPOOL_MAX=4 leaves one advisory-lock connection & four transaction
      # connections, preserving intentional row-contention tests.
      - name: Single-advisory-connection manifest & refund regressions
        env:
          PGPOOL_MAX: 4
        run: pnpm --filter @sellright/api exec vitest run --project db src/manifest/manifest-pending.db.test.ts src/manifest/catalog.db.test.ts src/orders/order-edit.db.test.ts src/orders/order-edit-lock.db.test.ts src/payments/refunds.stock-hook.test.ts

      - name: Verify database isolation invariants
        run: pnpm verify:db

  packaging:
    name: Production container smoke / Node 24 LTS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      POSTGRES_APP_PASSWORD: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      STOREFRONT_URL: https://shop.example.net
      DOWNLOAD_URL_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      SELLRIGHT_MASTER_KEY: '1122334455667788112233445566778811223344556677881122334455667788'
      RECOVERY_KIT_ID: ci-recovery-kit
      ADMIN_EMAIL: ci@example.net
      ADMIN_PASSWORD: ci-only-long-random-password-12345
      BOOTSTRAP_STORE_SLUG: ci
      BOOTSTRAP_STORE_NAME: CI Store
      BOOTSTRAP_STORE_CURRENCY: USD
      BOOTSTRAP_STORE_HOSTNAMES: shop.example.net
      SELLRIGHT_DOMAIN: sellright.example.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: |
          printf '[]\n' > deploy/gateway-accounts.json
          docker compose -f deploy/compose.yaml config --quiet

      - name: Validate Caddyfile
        run: |
          # SELLRIGHT_DOMAIN/SELLRIGHT_STOREFRONT_DOMAIN must be non-empty here:
          # an empty {$VAR} site address makes Caddy parse that block as GLOBAL
          # OPTIONS instead of a site, which then rejects `encode` as unknown.
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SELLRIGHT_DOMAIN=sellright.example.net \
            -e SELLRIGHT_STOREFRONT_DOMAIN=:8090 \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Verify Caddy visitor identity & spoof rejection
        run: bash scripts/test-caddy-client-ip.sh

      - name: Build production images
        run: docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml build api admin storefront

      - name: Start database, API, admin and storefront
        run: docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml up -d postgres api admin storefront

      - name: Wait for proxied readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f deploy/compose.yaml exec -T admin \
              wget -qO- http://127.0.0.1:8080/v1/readyz 2>/dev/null \
              | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --no-color
          exit 1

      - name: Verify admin security headers
        run: |
          docker compose -f deploy/compose.yaml exec -T admin \
            sh -c "wget -S -O /dev/null http://127.0.0.1:8080/index.html 2>&1 | grep -qi 'Content-Security-Policy:'"

      - name: Prove database backup and restore
        shell: bash
        run: |
          dump="$RUNNER_TEMP/sellright.dump"
          docker compose -f deploy/compose.yaml exec -T postgres \
            pg_dump -U sellright -d sellright -Fc > "$dump"
          test -s "$dump"
          docker compose -f deploy/compose.yaml exec -T postgres \
            createdb -U sellright sellright_restore
          cat "$dump" | docker compose -f deploy/compose.yaml exec -T postgres \
            pg_restore -U sellright -d sellright_restore --no-owner --no-privileges
          docker compose -f deploy/compose.yaml exec -T \
            -e DATABASE_URL="postgresql://sellright:${POSTGRES_PASSWORD}@postgres:5432/sellright_restore" \
            api node dist/scripts/migrate.js
          docker compose -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright_restore -Atc "SELECT count(*) FROM store WHERE slug = 'ci'" \
            | grep -qx '1'

      - name: Prove persistent-volume reboot and idempotent bootstrap
        shell: bash
        run: |
          before_id=$(docker compose -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT id FROM store WHERE slug = 'ci'")
          test -n "$before_id"
          docker compose -f deploy/compose.yaml exec -T api sh -c \
            "printf 'persistence-ok\n' > /app/var/assets/.ci-persistence && printf 'persistence-ok\n' > /app/var/downloads/.ci-persistence"
          docker compose -f deploy/compose.yaml down
          docker compose -f deploy/compose.yaml up -d postgres api admin storefront
          for attempt in {1..60}; do
            if docker compose -f deploy/compose.yaml exec -T admin \
              wget -qO- http://127.0.0.1:8080/v1/readyz 2>/dev/null \
              | grep -q '"status":"ok"'; then
              break
            fi
            test "$attempt" -lt 60 || exit 1
            sleep 2
          done
          after_id=$(docker compose -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT id FROM store WHERE slug = 'ci'")
          test "$before_id" = "$after_id"
          docker compose -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM store WHERE slug = 'ci'" \
            | grep -qx '1'
          docker compose -f deploy/compose.yaml exec -T api sh -c \
            "grep -qx persistence-ok /app/var/assets/.ci-persistence && grep -qx persistence-ok /app/var/downloads/.ci-persistence"

      - name: Tear down bootstrap-based stack (fresh volumes for the one-click drill)
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans

      - name: Start an UNbootstrapped stack (the real one-click install path — no ADMIN_EMAIL/PASSWORD/BOOTSTRAP_STORE_SLUG)
        env:
          ADMIN_EMAIL: ''
          ADMIN_PASSWORD: ''
          BOOTSTRAP_STORE_SLUG: ''
        run: docker compose -f deploy/compose.yaml up -d postgres api admin storefront

      - name: Wait for proxied readiness (unbootstrapped stack)
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f deploy/compose.yaml exec -T admin \
              wget -qO- http://127.0.0.1:8080/v1/readyz 2>/dev/null \
              | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --no-color
          exit 1

      - name: One-click install drill — no admin exists yet
        shell: bash
        run: |
          docker compose -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM admin_user" | grep -qx '0'

      - name: One-click install drill — setup-link, claim via API, setup surface 404s afterward, preview reachable
        shell: bash
        run: |
          set -e
          token=$(docker compose -f deploy/compose.yaml exec -T api node dist/scripts/setup-link.js)
          test -n "$token"
          echo "claim token acquired (length ${#token})"

          claim_body='{"token":"'"$token"'","email":"owner@example.net","name":"CI Owner","password":"correct horse battery staple"}'
          claim_resp=$(docker compose -f deploy/compose.yaml exec -T admin wget -qO- \
            --header="Content-Type: application/json" --post-data="$claim_body" \
            http://127.0.0.1:8080/v1/setup/claim)
          echo "$claim_resp" | grep -q '"storeSlug"' || { echo "claim failed: $claim_resp"; exit 1; }
          session_token=$(echo "$claim_resp" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).token))")
          test -n "$session_token"

          docker compose -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM admin_user WHERE is_installation_admin" | grep -qx '1'

          # Every /v1/setup/* route must 404 now that an installation admin exists.
          if docker compose -f deploy/compose.yaml exec -T admin wget -qO- http://127.0.0.1:8080/v1/setup/status >/tmp/setup-status.out 2>&1; then
            echo "expected /v1/setup/status to fail (404) after claim, got: $(cat /tmp/setup-status.out)"; exit 1
          fi

          # A second claim attempt with a fresh setup-link token must ALSO fail —
          # not just "the old token is used up" but "no installation admin can
          # ever be created again" (SetupAlreadyClaimedError, independent of the
          # token-consumption path — see setup-claim.ts's doc comment).
          if docker compose -f deploy/compose.yaml exec -T api node dist/scripts/setup-link.js; then
            echo "expected setup-link to fail once claimed"; exit 1
          fi

          # Issue a private-preview token as the freshly-claimed owner (bearer
          # auth — no CSRF/cookie dance needed for a non-browser client; see
          # cookies.ts's csrfValid: a valid bearer always passes).
          preview_resp=$(docker compose -f deploy/compose.yaml exec -T admin wget -qO- \
            --header="Authorization: Bearer $session_token" --header="Content-Type: application/json" \
            --post-data='{}' http://127.0.0.1:8080/v1/admin/settings/preview-token)
          preview_token=$(echo "$preview_resp" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).token))")
          test -n "$preview_token"
          echo "preview token issued"

          # Preview reachable, FATAL: the freshly-claimed store has no
          # config.hostnames yet (nothing on the admin surface ever set one —
          # see PATCH /v1/admin/settings/store's `hostnames` field, added
          # alongside this drill), so store-context.ts's Host-based resolution
          # can't match a raw container IP:port request no matter what. Set a
          # test hostname via that same PATCH (bearer auth, direct to the api
          # container — busybox wget on the admin image has no PATCH support),
          # then send that Host header when hitting the storefront directly.
          store_slug=$(echo "$claim_resp" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).storeSlug))")
          test -n "$store_slug"
          test_host="storefront-drill.test"
          docker compose -f deploy/compose.yaml exec -T api node -e "
            fetch('http://127.0.0.1:3300/v1/admin/settings/store', {
              method: 'PATCH',
              headers: { 'content-type': 'application/json', authorization: 'Bearer ${session_token}', 'x-store-slug': '${store_slug}' },
              body: JSON.stringify({ hostnames: ['${test_host}'] }),
            }).then(async r => { if (!r.ok) { console.error('hostnames PATCH failed', r.status, await r.text()); process.exit(1); } console.log('hostnames set'); })
              .catch(e => { console.error(e); process.exit(1); })
          "

          # WITH the preview token + matching Host -> the real storefront
          # chrome renders (200). A fresh store has zero products; this proves
          # the SSR path itself is crash-safe on an empty catalog (home/shop
          # loaders already degrade to an empty-state render — see
          # routes/index.tsx's useFeaturedProducts/useHomeCollections and
          # routes/shop/index.tsx's useCatalogLoader), not just that the
          # process is technically alive.
          storefront_ok=0
          for attempt in $(seq 1 15); do
            if docker compose -f deploy/compose.yaml exec -T storefront node -e "
              const http = require('node:http');
              const req = http.request({ host: '127.0.0.1', port: 4100, path: '/?preview_token=${preview_token}', headers: { Host: '${test_host}' } }, (res) => {
                console.log('with preview_token: status', res.statusCode);
                process.exit(res.statusCode === 200 ? 0 : 1);
              });
              req.on('error', (e) => { console.error(e); process.exit(1); });
              req.end();
            "; then
              storefront_ok=1
              break
            fi
            sleep 2
          done
          if [ "$storefront_ok" -ne 1 ]; then
            docker compose -f deploy/compose.yaml logs storefront --no-color | tail -c 4000
            echo "::error::storefront never returned 200 for the preview-token request"
            exit 1
          fi

          # WITHOUT the token (matching Host, unpublished store) -> the
          # storefront must gate it: either a real 404, or a 200 that's
          # unambiguously the ComingSoon page (never the real storefront
          # chrome — plan §1.5's "unpublished storefront reveals nothing").
          docker compose -f deploy/compose.yaml exec -T storefront node -e "
            const http = require('node:http');
            const req = http.request({ host: '127.0.0.1', port: 4100, path: '/', headers: { Host: '${test_host}' } }, (res) => {
              let body = '';
              res.on('data', (c) => { body += c; });
              res.on('end', () => {
                console.log('without preview_token: status', res.statusCode);
                if (res.statusCode === 404) { process.exit(0); }
                if (res.statusCode === 200 && /being set up/i.test(body)) { process.exit(0); }
                console.error('expected 404 or a coming-soon page, got', res.statusCode);
                process.exit(1);
              });
            });
            req.on('error', (e) => { console.error(e); process.exit(1); });
            req.end();
          " || { docker compose -f deploy/compose.yaml logs storefront --no-color | tail -c 4000; exit 1; }

      - name: Tear down smoke stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans

  migration-compat:
    name: Migration compat (previous release's API vs new schema)
    # See docs/runbooks/migrations.md "Expand/contract policy" — this proves
    # the specific claim `sellright update`'s automatic rollback depends on:
    # the immediately-previous release's API still serves correctly once
    # THIS PR's migrations have been applied. Skipped on main itself (there is
    # no "previous release" relative to main's own HEAD) and on the very first
    # commit of a repo (no parent to diff against).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sellright_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # NODE_ENV=test (not production) deliberately: env.ts's production-only
      # guard (env-runtime.ts productionEnvErrors) refuses to boot against a
      # DATABASE_URL containing "test" — exactly the throwaway CI database
      # this job uses, same as the `database` job above. This job is proving
      # schema/route compatibility, not production env validation.
      NODE_ENV: test
      # Privileged (superuser) URL: migrate.js and bootstrap.js need to create
      # tables/roles. The compiled server itself refuses to boot on this URL
      # (SR-01's own-role guard, packages/api/src/db/client.ts) — it gets the
      # dedicated NOSUPERUSER NOBYPASSRLS app role instead (created below,
      # same as the `database` job above).
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_test
      DATABASE_URL: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_test
      STOREFRONT_URL: https://shop.example.net
      DOWNLOAD_URL_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      ADMIN_EMAIL: compat@example.net
      ADMIN_PASSWORD: compat-only-long-random-password-12345
      BOOTSTRAP_STORE_SLUG: compat
      BOOTSTRAP_STORE_NAME: Compat Store
      BOOTSTRAP_STORE_CURRENCY: USD
      FUNCTIONAL_CHECK_STORE_SLUG: compat
    steps:
      - name: Checkout PR (new schema)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new

      - name: Checkout main (previous release's code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: old

      - uses: pnpm/setup@e0ed22ae4d909f13ed5d2688513f73e1875e46db # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
          # pnpm/setup v3 would otherwise install Node from .nvmrc; setup-node owns Node here.
          node-version-file: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}

      - name: Install + build PR (new) — used only to run its migrations
        working-directory: new
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sellright/shared build
          pnpm --filter @sellright/api build

      - name: Install + build main (old) — this is the API under test
        working-directory: old
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sellright/shared build
          pnpm --filter @sellright/api build

      - name: Apply the PR's migrations to the test database
        working-directory: new
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
        run: pnpm --filter @sellright/api db:migrate:runtime

      - name: Create non-owner RLS app role (same as the `database` job)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sellright_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sellright_app') THEN
              CREATE ROLE sellright_app LOGIN PASSWORD 'sellright_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE sellright_test TO sellright_app;
          GRANT USAGE ON SCHEMA public TO sellright_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sellright_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sellright_app;
          SQL

      - name: Bootstrap a test store (using the PR's bootstrap script)
        working-directory: new
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
        run: node packages/api/dist/scripts/bootstrap.js

      - name: Start the PREVIOUS release's API against the migrated schema
        working-directory: old
        run: |
          nohup node packages/api/dist/index.js > /tmp/old-api.log 2>&1 &
          echo $! > /tmp/old-api.pid

      - name: Smoke-test the previous release's API
        run: |
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/v1/readyz | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "::error::previous release never became ready"; cat /tmp/old-api.log; exit 1; }
          curl -fsS -H 'x-store-slug: compat' http://127.0.0.1:3300/v1/shop/catalog/products \
            || { echo "::error::previous release's catalog read failed against the new schema"; cat /tmp/old-api.log; exit 1; }
          echo "previous release's API is compatible with this PR's schema"

      - name: Stop the previous release's API
        if: always()
        run: kill "$(cat /tmp/old-api.pid)" 2>/dev/null || true

  e2e-storefront:
    name: Storefront e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # packages/storefront/playwright.config.ts starts everything itself: the mock gateways (NMI / Sezzle / webhook
      # receiver / SMTP sink), a throwaway API from packages/api/dist (e2e/support/start-api.mjs drops + recreates
      # `sellright_storefront_e2e`, migrates, bootstraps the e2e store + owner, then serves as the NOSUPERUSER
      # NOBYPASSRLS role below) and the storefront production build. Money-path specs place real orders against it.
      E2E_DB_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_storefront_e2e
      E2E_APP_DATABASE_URL: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_storefront_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@e0ed22ae4d909f13ed5d2688513f73e1875e46db # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
          # pnpm/setup v3 would otherwise install Node from .nvmrc; setup-node owns Node here.
          node-version-file: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared + api + storefront-client
        run: |
          pnpm --filter @sellright/shared build
          pnpm --filter @sellright/api build
          pnpm --filter @sellright/storefront-client build

      - name: Install Playwright's Chromium
        working-directory: packages/storefront
        run: npx playwright install --with-deps chromium

      - name: Run the storefront e2e suite
        working-directory: packages/storefront
        # `test:e2e` builds the storefront (SSG off) into server-e2e/dist-e2e, then runs the suite.
        env:
          # Enables the A12 loader/action re-export probe: e2e/platform-reexport.spec.ts runs and the probe route answers
          # (it is a 404 without this variable, in the runner and in the storefront server).
          E2E_PLATFORM_PROBE: '1'
        run: pnpm run test:e2e

      # The Stripe-enabled harness (E2E_STRIPE=1 seeds Stripe as the checkout card method) is a different checkout from
      # the default one, so it runs as its own invocation against a freshly recreated database + API. The storefront
      # build from the step above is reused.
      - name: Run the Stripe payment-init e2e spec (E2E_STRIPE=1)
        working-directory: packages/storefront
        env:
          E2E_STRIPE: '1'
        run: pnpm run test:e2e:run e2e/payment-init-browser.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          # test-results/ (traces + only-on-failure screenshots) is where a
          # failure actually lands per playwright.config.ts's `use` block —
          # playwright-report/ only gets content from the 'html' reporter.
          # Upload both so a failed run leaves something to inspect.
          path: |
            packages/storefront/playwright-report/
            packages/storefront/test-results/
          retention-days: 7

  e2e-admin:
    name: Admin e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # packages/admin/playwright.config.ts starts the API (packages/api/dist) and the built admin itself;
      # e2e/support/start-api.mjs drops + recreates `sellright_admin_e2e`, migrates, bootstraps the e2e store and
      # owner, then serves as the NOSUPERUSER NOBYPASSRLS role below (the API refuses to serve as a superuser).
      E2E_DB_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sellright_admin_e2e
      E2E_APP_DATABASE_URL: postgres://sellright_app:sellright_app@127.0.0.1:5432/sellright_admin_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@e0ed22ae4d909f13ed5d2688513f73e1875e46db # v3.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
          # pnpm/setup v3 would otherwise install Node from .nvmrc; setup-node owns Node here.
          node-version-file: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/admin/pnpm-lock.yaml

      - name: Install core workspace
        run: pnpm install --frozen-lockfile

      - name: Install admin
        run: pnpm --dir packages/admin install --frozen-lockfile

      - name: Build shared + api
        run: |
          pnpm --filter @sellright/shared build
          pnpm --filter @sellright/api build

      - name: Install Playwright's Chromium
        working-directory: packages/admin
        run: pnpm exec playwright install --with-deps chromium

      # `test:e2e` builds the admin SPA into dist-e2e (production build, SELLRIGHT_BUILD_SUFFIX=e2e) and runs the
      # suite; Playwright's webServer entries start the API and `vite preview`, globalSetup seeds + signs in.
      - name: Run the admin e2e suite
        working-directory: packages/admin
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-playwright-report
          path: |
            packages/admin/playwright-report/
            packages/admin/test-results/
          retention-days: 7

  shellcheck:
    name: Shellcheck installer + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backup & restore private-file regressions
        run: sh deploy/tests/test-backup-restore.sh
      - name: Installer & update image-verification regressions
        run: |
          sh deploy/tests/test-cosign-verify.sh
          sh deploy/tests/test-installer-image-binding.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: deploy
          severity: style
          ignore_names: demo

  release:
    name: Build, push and sign images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, database, packaging, e2e-storefront, shellcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component: [api, admin, storefront]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Keep signing with cosign 2.x: deploy/install.sh + sellright.sh verify with
          # COSIGN_VERSION 2.4.1, which cannot read cosign 3's new-bundle signatures.
          cosign-release: 'v2.4.1'

      - name: Resolve build context/dockerfile
        id: ctx
        run: |
          case "${{ matrix.component }}" in
            admin)
              printf 'context=packages/admin\n' >> "$GITHUB_OUTPUT"
              printf 'dockerfile=packages/admin/Dockerfile\n' >> "$GITHUB_OUTPUT"
              ;;
            api)
              printf 'context=.\n' >> "$GITHUB_OUTPUT"
              printf 'dockerfile=packages/api/Dockerfile\n' >> "$GITHUB_OUTPUT"
              ;;
            storefront)
              printf 'context=.\n' >> "$GITHUB_OUTPUT"
              printf 'dockerfile=packages/storefront/Dockerfile\n' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/orthic-labs/sellright-${{ matrix.component }}:latest
            ghcr.io/orthic-labs/sellright-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      # Keyless signing: no key material anywhere. Sigstore's Fulcio issues a
      # short-lived cert bound to this workflow's OIDC identity
      # (id-token: write above), and the signature + certificate are uploaded
      # to the public Rekor transparency log. install.sh's `cosign verify`
      # step checks the image digest against that same identity/issuer.
      - name: Sign image (cosign keyless)
        run: |
          cosign sign --yes "ghcr.io/orthic-labs/sellright-${{ matrix.component }}@${{ steps.build.outputs.digest }}"

      - name: Record digest
        run: |
          echo "${{ matrix.component }} -> ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  verify-appliance:
    name: Recovery drill (backup -> destroy -> restore)
    needs: [release]
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: driltest0123456789abcdef0123456789abcdef0123456789abcdef012345
      POSTGRES_APP_PASSWORD: driltest9876543210fedcba9876543210fedcba9876543210fedcba987654
      STOREFRONT_URL: https://shop.example.net
      DOWNLOAD_URL_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      ADMIN_EMAIL: drill@example.net
      ADMIN_PASSWORD: drill-only-long-random-password-12345
      BOOTSTRAP_STORE_SLUG: drill
      BOOTSTRAP_STORE_NAME: Drill Store
      BOOTSTRAP_STORE_CURRENCY: USD
      BOOTSTRAP_STORE_HOSTNAMES: shop.example.net
      SELLRIGHT_DOMAIN: sellright.example.net
      SMTP_ENABLED: "false"
      JOBS_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rclone (off-site backup path)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends rclone

      - name: Write appliance env
        run: |
          umask 077
          master_key=$(openssl rand -hex 32)
          kit_id=$(openssl rand -hex 4)
          mkdir -p "${{ github.workspace }}/offsite-remote"
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_APP_PASSWORD=%s\n' "$POSTGRES_APP_PASSWORD"
            printf 'STOREFRONT_URL=%s\n' "$STOREFRONT_URL"
            printf 'DOWNLOAD_URL_SECRET=%s\n' "$DOWNLOAD_URL_SECRET"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'BOOTSTRAP_STORE_SLUG=%s\n' "$BOOTSTRAP_STORE_SLUG"
            printf 'BOOTSTRAP_STORE_NAME=%s\n' "$BOOTSTRAP_STORE_NAME"
            printf 'BOOTSTRAP_STORE_CURRENCY=%s\n' "$BOOTSTRAP_STORE_CURRENCY"
            printf 'BOOTSTRAP_STORE_HOSTNAMES=%s\n' "$BOOTSTRAP_STORE_HOSTNAMES"
            printf 'SELLRIGHT_DOMAIN=%s\n' "$SELLRIGHT_DOMAIN"
            printf 'SMTP_ENABLED=%s\n' "$SMTP_ENABLED"
            printf 'JOBS_ENABLED=%s\n' "$JOBS_ENABLED"
            printf 'SELLRIGHT_MASTER_KEY=%s\n' "$master_key"
            printf 'RECOVERY_KIT_ID=%s\n' "$kit_id"
            # rclone treats a plain filesystem path (no 'remote:' prefix) as a
            # local backend directly — no cloud account/config needed for the
            # drill to exercise the real off-site copy + encrypt code path.
            printf 'SELLRIGHT_OFFSITE_REMOTE=%s\n' "${{ github.workspace }}/offsite-remote"
          } > deploy/.env
          # This recovery kit mirrors what install.sh writes at real install
          # time (same masterKey/kitId as deploy/.env) — 'sellright restore'
          # reads it, not the env vars, when decrypting an off-site set.
          printf '{"kitId":"%s","generatedAt":"2026-01-01T00:00:00Z","masterKey":"%s","backupLocation":"local"}\n' \
            "$kit_id" "$master_key" > deploy/recovery-kit.json
          # Reset the umask before this: it's a Compose secret bind-mounted
          # read-only into the api container for the non-root `node` user, not
          # a host secret needing the .env's 600. A umask-077 0600 file here
          # (owned by the runner's uid) makes the API crash at boot with
          # EACCES reading /run/secrets/gateway_accounts as `node`.
          ( umask 022 && printf '[]\n' > deploy/gateway-accounts.json )

      # This drill proves the recovery MECHANISM (backup set shape, restore
      # into a disposable database, data present) using this PR's own
      # locally-built images. It intentionally does NOT run install.sh's
      # cosign-verified pull — those signed images only exist for pushes to
      # main (the `release` job above), so a PR branch has none yet to verify.
      - name: Build appliance images (isolated project)
        run: |
          docker compose -p sellright-drill -f deploy/compose.yaml -f deploy/compose.build.yaml \
            build api admin storefront

      - name: Start appliance
        run: |
          docker compose -p sellright-drill -f deploy/compose.yaml -f deploy/compose.build.yaml \
            up -d postgres db-init api admin storefront || {
              echo "::group::api logs"
              docker compose -p sellright-drill -f deploy/compose.yaml logs api --no-color || true
              echo "::endgroup::"
              echo "::group::db-init logs"
              docker compose -p sellright-drill -f deploy/compose.yaml logs db-init --no-color || true
              echo "::endgroup::"
              echo "::group::admin logs"
              docker compose -p sellright-drill -f deploy/compose.yaml logs admin --no-color || true
              echo "::endgroup::"
              echo "::group::storefront logs"
              docker compose -p sellright-drill -f deploy/compose.yaml logs storefront --no-color || true
              echo "::endgroup::"
              exit 1
            }

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -p sellright-drill -f deploy/compose.yaml exec -T admin \
              wget -qO- http://127.0.0.1:8080/v1/readyz 2>/dev/null | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p sellright-drill -f deploy/compose.yaml ps
          docker compose -p sellright-drill -f deploy/compose.yaml logs --no-color
          exit 1

      - name: Seed recognizable asset + download sentinels
        run: |
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T api sh -c \
            "printf 'drill-asset-sentinel\n' > /app/var/assets/.drill-sentinel && \
             printf 'drill-download-sentinel\n' > /app/var/downloads/.drill-sentinel"

      - name: Backup --offsite (sellright CLI) and verify authenticated encryption
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/deploy
        run: |
          sed -i "s#docker compose --env-file#docker compose -p sellright-drill --env-file#" deploy/sellright.sh
          sh deploy/sellright.sh backup --offsite
          out_dir=$(find deploy/backups -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          echo "BACKUP_DIR=$out_dir" >> "$GITHUB_ENV"
          test -s "$out_dir/database.dump"
          test -s "$out_dir/assets.tar.gz"
          test -s "$out_dir/downloads.tar.gz"
          test -s "$out_dir/manifest.json"
          grep -q sha256 "$out_dir/manifest.json"
          test "$(stat -c %a deploy/backups)" = 700
          test "$(stat -c %a "$out_dir")" = 700
          test -z "$(find "$out_dir" -type f ! -perm 600 -print -quit)"
          tar xzOf "$out_dir/assets.tar.gz" assets/.drill-sentinel | grep -qx drill-asset-sentinel
          tar xzOf "$out_dir/downloads.tar.gz" downloads/.drill-sentinel | grep -qx drill-download-sentinel

          offsite_dir="${{ github.workspace }}/offsite-remote/$(basename "$out_dir")"
          echo "OFFSITE_DIR=$offsite_dir" >> "$GITHUB_ENV"
          for f in database.dump assets.tar.gz downloads.tar.gz manifest.json; do
            test -s "${offsite_dir}/${f}.enc"
            test -s "${offsite_dir}/${f}.enc.hmac"
          done

      - name: Corrupt plain database must leave live appliance unchanged
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/deploy
        run: |
          corrupt_dir=$(mktemp -d)
          trap 'rm -rf "$corrupt_dir"' EXIT
          cp "$BACKUP_DIR"/* "$corrupt_dir"/
          printf 'invalid PostgreSQL archive\n' > "$corrupt_dir/database.dump"
          # Match its manifest hash so rejection exercises PostgreSQL preflight,
          # rather than stopping at checksum validation.
          python3 - "$corrupt_dir" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['parts']['database.dump'] = 'sha256:' + hashlib.sha256((root / 'database.dump').read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest))
          PY
          before=$(docker compose -p sellright-drill -f deploy/compose.yaml ps -q api)
          if SELLRIGHT_SOURCE="$GITHUB_WORKSPACE" sh deploy/sellright.sh restore --from-source --kit deploy/recovery-kit.json --set "$corrupt_dir" --yes \
              > /tmp/plain-corrupt-restore.log 2>&1; then
            echo "::error::restore accepted a corrupt PostgreSQL archive"
            exit 1
          fi
          grep -q 'pg_restore:' /tmp/plain-corrupt-restore.log || { cat /tmp/plain-corrupt-restore.log; exit 1; }
          test "$before" = "$(docker compose -p sellright-drill -f deploy/compose.yaml ps -q api)"
          test "$(docker inspect --format='{{.State.Running}}' "$before")" = true
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT name FROM store WHERE slug = 'drill'" | grep -qx 'Drill Store'
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T api sh -c \
            'grep -qx drill-asset-sentinel /app/var/assets/.drill-sentinel && grep -qx drill-download-sentinel /app/var/downloads/.drill-sentinel'

      - name: Restore valid plain set into live appliance
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/deploy
        run: |
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -v ON_ERROR_STOP=1 -c "UPDATE store SET name = 'changed before plain restore' WHERE slug = 'drill'"
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T api sh -c \
            'printf changed > /app/var/assets/.drill-sentinel; printf changed > /app/var/downloads/.drill-sentinel'
          SELLRIGHT_SOURCE="$GITHUB_WORKSPACE" sh deploy/sellright.sh restore --from-source --kit deploy/recovery-kit.json --set "$BACKUP_DIR" --yes
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT name FROM store WHERE slug = 'drill'" | grep -qx 'Drill Store'
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T api sh -c \
            'grep -qx drill-asset-sentinel /app/var/assets/.drill-sentinel && grep -qx drill-download-sentinel /app/var/downloads/.drill-sentinel'

      - name: Tampered off-site backup must be rejected, not restored
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/deploy
        run: |
          tampered_dir=$(mktemp -d)
          cp "$OFFSITE_DIR"/* "$tampered_dir"/
          # Flip one byte inside the ciphertext (not the .hmac tag) so the
          # HMAC recomputed at restore time no longer matches.
          python3 - "$tampered_dir/database.dump.enc" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path, "r+b") as f:
              f.seek(0)
              b = f.read(1)
              f.seek(0)
              f.write(bytes([b[0] ^ 0xFF]))
          PY
          if SELLRIGHT_SOURCE="$GITHUB_WORKSPACE" sh deploy/sellright.sh restore --from-source --kit deploy/recovery-kit.json --set "$tampered_dir" --yes \
              > /tmp/tamper-restore.log 2>&1; then
            echo "::error::restore succeeded against a tampered backup — integrity check did not work"
            cat /tmp/tamper-restore.log
            exit 1
          fi
          grep -qi "integrity check failed" /tmp/tamper-restore.log || {
            echo "::error::restore failed for the wrong reason (expected an integrity-check message)"
            cat /tmp/tamper-restore.log
            exit 1
          }
          echo "Tampered backup correctly rejected:"
          grep -i "integrity check failed" /tmp/tamper-restore.log
          rm -rf "$tampered_dir"
          # The live store must be completely unaffected by the rejected attempt.
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM store WHERE slug = 'drill'" \
            | grep -qx '1'

      - name: Destroy volumes (simulate total server loss)
        run: |
          docker compose -p sellright-drill -f deploy/compose.yaml down -v --remove-orphans

      - name: Bring up a fresh database only
        run: |
          docker compose -p sellright-drill -f deploy/compose.yaml -f deploy/compose.build.yaml \
            up -d postgres db-init

      - name: Restore --yes from the off-site (encrypted) set and verify full promotion
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/deploy
        run: |
          SELLRIGHT_SOURCE="$GITHUB_WORKSPACE" sh deploy/sellright.sh restore --from-source --kit deploy/recovery-kit.json --set "$OFFSITE_DIR" --yes

          # Assets/downloads promotion and the database rename both happen
          # inside `restore` itself, before it starts api back up — check them
          # via a fresh one-off container rather than racing api's own
          # migrate/bootstrap startup sequence.
          restored_api=$(docker compose -p sellright-drill -f deploy/compose.yaml ps -q api)
          restored_image=$(docker inspect --format '{{.Image}}' "$restored_api")
          printf '%s\n' "$restored_image" | grep -Eq '^sha256:[a-f0-9]{64}$'
          docker run --rm --pull never --network none --volumes-from "${restored_api}:ro" \
            --entrypoint sh "$restored_image" \
            -c "grep -qx drill-asset-sentinel /app/var/assets/.drill-sentinel && \
                grep -qx drill-download-sentinel /app/var/downloads/.drill-sentinel"

          # Database was PROMOTED (renamed) — the live 'sellright' database
          # itself must have the restored data now, not a side database.
          docker compose -p sellright-drill -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM store WHERE slug = 'drill'" \
            | grep -qx '1'

          # And prove the promoted stack actually comes back up healthy end to
          # end, not just that the files/rows are in the right place.
          cid=$(docker compose -p sellright-drill -f deploy/compose.yaml ps -q api)
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "")
            [ "$status" = "healthy" ] && break
            test "$attempt" -lt 60 || {
              docker compose -p sellright-drill -f deploy/compose.yaml logs api --no-color
              exit 1
            }
            sleep 2
          done

      - name: Tear down drill stack
        if: always()
        run: docker compose -p sellright-drill -f deploy/compose.yaml down -v --remove-orphans

  verify-update:
    name: Update drill (forced failure -> rollback, then a clean update)
    # Needs real, cosign-signed images at a real registry ref: `sellright
    # update` (deploy/sellright.sh cosign_verify_images) is fail-closed by
    # design (see docs/runbooks/migrations.md and cmd_update) and refuses to
    # run anything it can't verify — so unlike verify-appliance above (which
    # deliberately uses unsigned local builds to test the backup/restore
    # mechanism only), this job must push two real, signed tag sets to GHCR
    # and run THIS PR's own deploy/sellright.sh (the update logic under test)
    # to move a running appliance from the first set to the second, with the
    # exact identity `sellright update`'s cosign verify step checks (this
    # repo's own OIDC workflow identity — the same one the `release` job
    # signs with).
    #
    # "OLD" is intentionally NOT built from `main`: this PR is the one that
    # introduces `sellright maintenance`/`functional-check.js` in the first
    # place, so `main`'s api image has neither script, and step 1 of
    # `cmd_update` (`sellright maintenance on`, which execs into the
    # CURRENTLY RUNNING container) would fail before ever reaching the part
    # under test. That bootstrapping gap is specific to this one PR — any
    # real install already on a WS-E-or-later release doesn't have it. So
    # "OLD" here is pinned to this branch's own first WS-E commit (which
    # already has maintenance-cli.js/functional-check.js, just not this PR's
    # later fail-closed-cosign and forced-failure-testing additions), and
    # "NEW" is this PR's current HEAD — a realistic same-branch upgrade.
    if: github.event_name == 'pull_request'
    needs: [verify, database, packaging, e2e-storefront, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      OLD_REF: 79484e4ad30ea8183437d5855acfb81fbcd4cc09
      OLD_TAG: update-drill-old-${{ github.run_id }}
      NEW_TAG: update-drill-new-${{ github.run_id }}
      POSTGRES_PASSWORD: updrltest0123456789abcdef0123456789abcdef0123456789abcdef01234
      POSTGRES_APP_PASSWORD: updrltest9876543210fedcba9876543210fedcba9876543210fedcba98765
      STOREFRONT_URL: https://shop.example.net
      DOWNLOAD_URL_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      # WS-B: compose.yaml's api service now requires SELLRIGHT_MASTER_KEY
      # (previously generated into deploy/.env by install.sh but never
      # actually wired through to the container — see that fix's commit).
      # Quoted: an unquoted all-digit YAML scalar is parsed as a number.
      SELLRIGHT_MASTER_KEY: '1122334455667788112233445566778811223344556677881122334455667788'
      RECOVERY_KIT_ID: update-drill-recovery-kit
      ADMIN_EMAIL: updrill@example.net
      ADMIN_PASSWORD: updrill-only-long-random-password-12345
      BOOTSTRAP_STORE_SLUG: updrill
      BOOTSTRAP_STORE_NAME: Update Drill Store
      BOOTSTRAP_STORE_CURRENCY: USD
      BOOTSTRAP_STORE_HOSTNAMES: shop.example.net
      SELLRIGHT_DOMAIN: sellright.example.net
      SELLRIGHT_IMAGE_PREFIX: ghcr.io/orthic-labs/sellright
      SMTP_ENABLED: "false"
      JOBS_ENABLED: "0"
    steps:
      - name: Checkout PR (the update / the CLI under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new

      - name: Checkout this branch's first WS-E commit (the "currently-installed" version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.OLD_REF }}
          path: old

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Keep signing with cosign 2.x: deploy/install.sh + sellright.sh verify with
          # COSIGN_VERSION 2.4.1, which cannot read cosign 3's new-bundle signatures.
          cosign-release: 'v2.4.1'

      # Unrolled per component/version (6 explicit build-and-push steps) rather
      # than a matrix or a bash loop calling `docker buildx build` directly —
      # this reuses the exact `docker/build-push-action` invocation the
      # `release` job above already proves works on this repo's runners
      # (no separate setup-buildx-action step needed), just against a
      # throwaway tag instead of `:latest`/`:sha`.
      - name: Build + push OLD api (from main)
        id: build_old_api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: old
          file: old/packages/api/Dockerfile
          push: true
          tags: ${{ env.SELLRIGHT_IMAGE_PREFIX }}-api:${{ env.OLD_TAG }}

      - name: Build + push OLD admin (from main)
        id: build_old_admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: old/packages/admin
          file: old/packages/admin/Dockerfile
          push: true
          tags: ${{ env.SELLRIGHT_IMAGE_PREFIX }}-admin:${{ env.OLD_TAG }}

      - name: Build + push OLD storefront (from main)
        id: build_old_storefront
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: old
          file: old/packages/storefront/Dockerfile
          push: true
          tags: ${{ env.SELLRIGHT_IMAGE_PREFIX }}-storefront:${{ env.OLD_TAG }}

      - name: Build + push NEW api (from this PR)
        id: build_new_api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: new
          file: new/packages/api/Dockerfile
          push: true
          tags: ${{ env.SELLRIGHT_IMAGE_PREFIX }}-api:${{ env.NEW_TAG }}

      - name: Build + push NEW admin (from this PR)
        id: build_new_admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: new/packages/admin
          file: new/packages/admin/Dockerfile
          push: true
          tags: ${{ env.SELLRIGHT_IMAGE_PREFIX }}-admin:${{ env.NEW_TAG }}

      - name: Build + push NEW storefront (from this PR)
        id: build_new_storefront
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: new
          file: new/packages/storefront/Dockerfile
          push: true
          tags: ${{ env.SELLRIGHT_IMAGE_PREFIX }}-storefront:${{ env.NEW_TAG }}

      - name: Sign both image sets (cosign keyless) and record digests
        run: |
          set -e
          declare -A digests=(
            [OLD_DIGEST_api]="${{ steps.build_old_api.outputs.digest }}"
            [OLD_DIGEST_admin]="${{ steps.build_old_admin.outputs.digest }}"
            [OLD_DIGEST_storefront]="${{ steps.build_old_storefront.outputs.digest }}"
            [NEW_DIGEST_api]="${{ steps.build_new_api.outputs.digest }}"
            [NEW_DIGEST_admin]="${{ steps.build_new_admin.outputs.digest }}"
            [NEW_DIGEST_storefront]="${{ steps.build_new_storefront.outputs.digest }}"
          )
          for key in "${!digests[@]}"; do
            digest="${digests[$key]}"
            component=$(printf '%s' "$key" | sed -E 's/^(OLD|NEW)_DIGEST_//')
            cosign sign --yes "${SELLRIGHT_IMAGE_PREFIX}-${component}@${digest}"
            echo "${key}=${digest}" >> "$GITHUB_ENV"
          done

      - name: Write appliance env, pinned to the OLD image set
        working-directory: new
        run: |
          umask 022
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_APP_PASSWORD=%s\n' "$POSTGRES_APP_PASSWORD"
            printf 'STOREFRONT_URL=%s\n' "$STOREFRONT_URL"
            printf 'DOWNLOAD_URL_SECRET=%s\n' "$DOWNLOAD_URL_SECRET"
            printf 'SELLRIGHT_MASTER_KEY=%s\n' "$SELLRIGHT_MASTER_KEY"
            printf 'RECOVERY_KIT_ID=%s\n' "$RECOVERY_KIT_ID"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'BOOTSTRAP_STORE_SLUG=%s\n' "$BOOTSTRAP_STORE_SLUG"
            printf 'BOOTSTRAP_STORE_NAME=%s\n' "$BOOTSTRAP_STORE_NAME"
            printf 'BOOTSTRAP_STORE_CURRENCY=%s\n' "$BOOTSTRAP_STORE_CURRENCY"
            printf 'BOOTSTRAP_STORE_HOSTNAMES=%s\n' "$BOOTSTRAP_STORE_HOSTNAMES"
            printf 'SELLRIGHT_DOMAIN=%s\n' "$SELLRIGHT_DOMAIN"
            printf 'SMTP_ENABLED=%s\n' "$SMTP_ENABLED"
            printf 'JOBS_ENABLED=%s\n' "$JOBS_ENABLED"
            printf 'SELLRIGHT_IMAGE_PREFIX=%s\n' "$SELLRIGHT_IMAGE_PREFIX"
            printf 'SELLRIGHT_IMAGE_TAG=%s\n' "$OLD_TAG"
          } > deploy/.env
          ( umask 022 && printf '[]\n' > deploy/gateway-accounts.json )
          # verify-appliance's own trick: pin every compose invocation to an
          # isolated project name so this job never collides with another
          # concurrent job's containers/volumes on the same runner image cache.
          sed -i "s#docker compose --env-file#docker compose -p sellright-updatedrill --env-file#" deploy/sellright.sh

      - name: Install the OLD image set
        working-directory: new
        run: |
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml \
            pull postgres api admin storefront
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml \
            up -d postgres db-init api admin storefront || {
              docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml logs --no-color
              exit 1
            }

      - name: Wait for the OLD install to become ready
        working-directory: new
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T admin \
              wget -qO- http://127.0.0.1:8080/v1/readyz 2>/dev/null | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml logs --no-color
          exit 1

      - name: Seed sentinel data (asset file + DB row) on the OLD install
        working-directory: new
        run: |
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T api sh -c \
            "printf 'update-drill-sentinel\n' > /app/var/assets/.update-drill-sentinel"
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc \
            "SELECT count(*) FROM store WHERE slug = 'updrill'" | grep -qx '1'

      - name: Forced-failure drill -- update must roll back before reopening
        working-directory: new
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/new/deploy
        run: |
          set -e
          sed -i "s/^SELLRIGHT_IMAGE_TAG=.*/SELLRIGHT_IMAGE_TAG=${NEW_TAG}/" deploy/.env
          printf 'FUNCTIONAL_CHECK_FORCE_FAIL=true\n' >> deploy/.env
          if sh deploy/sellright.sh update; then
            echo "::error::sellright update was expected to FAIL (forced functional-check failure) but exited 0"
            exit 1
          fi
          echo "update correctly reported failure; verifying the rollback..."

      - name: Assert rollback -- previous digests running, maintenance still on, sentinel intact
        working-directory: new
        run: |
          set -e
          for component in api admin storefront; do
            ref=$(docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml images -q "$component")
            running_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | sed 's/^[^@]*@//')
            expected="OLD_DIGEST_${component}"
            if [ "$running_digest" != "${!expected}" ]; then
              echo "::error::${component} is running ${running_digest}, expected the OLD digest ${!expected}"
              exit 1
            fi
          done
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T admin \
            wget -qO- http://127.0.0.1:8080/v1/maintenance | grep -q '"maintenance":true'
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T api sh -c \
            "cat /app/var/assets/.update-drill-sentinel" | grep -qx 'update-drill-sentinel'
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM store WHERE slug = 'updrill'" | grep -qx '1'
          echo "rollback verified: previous images running, maintenance still on, sentinel data intact"

      - name: Clean update -- turn off the forced failure and update again
        working-directory: new
        env:
          SELLRIGHT_HOME: ${{ github.workspace }}/new/deploy
        run: |
          set -e
          sed -i "/^FUNCTIONAL_CHECK_FORCE_FAIL=/d" deploy/.env
          sh deploy/sellright.sh update

      - name: Assert the clean update succeeded -- new digests running, maintenance off
        working-directory: new
        run: |
          set -e
          for component in api admin storefront; do
            ref=$(docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml images -q "$component")
            running_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | sed 's/^[^@]*@//')
            expected="NEW_DIGEST_${component}"
            if [ "$running_digest" != "${!expected}" ]; then
              echo "::error::${component} is running ${running_digest}, expected the NEW digest ${expected}=${!expected}"
              exit 1
            fi
          done
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T admin \
            wget -qO- http://127.0.0.1:8080/v1/maintenance | grep -q '"maintenance":false'
          echo "clean update verified: new images running, maintenance off"

      - name: WS-B upgrade regression -- the ADMIN_EMAIL/ADMIN_PASSWORD bootstrap admin from the OLD release can still log in, and gets promoted to installation admin
        working-directory: new
        run: |
          set -e
          # This admin was created by the OLD image's bootstrap.js, long
          # before admin_user.is_installation_admin (0072) or the
          # hasAnyAdmin()-gated claim surface existed. The bug this proves
          # fixed: upgrading past 0072 must never lock this admin out behind
          # the claim-only UI (GET /v1/setup/status must 404, not 200), and
          # 0075_promote_installation_admin.sql must promote exactly this
          # admin (the install's only owner) so recovery-kit/system
          # operations stay reachable post-upgrade.
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T admin \
            wget -qO- http://127.0.0.1:8080/v1/setup/status >/tmp/updrill-setup-status.out 2>&1 \
            && { echo "::error::expected /v1/setup/status to 404 after upgrade (an admin already exists), got: $(cat /tmp/updrill-setup-status.out)"; exit 1; }
          echo "setup surface correctly still 404s post-upgrade"

          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT count(*) FROM admin_user WHERE is_installation_admin" | grep -qx '1'
          docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T postgres \
            psql -U sellright -d sellright -Atc "SELECT email FROM admin_user WHERE is_installation_admin" | grep -qx "${ADMIN_EMAIL}"
          echo "the pre-existing bootstrap admin was promoted to installation admin"

          login_resp=$(docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T admin wget -qSO- \
            --header="Content-Type: application/json" \
            --post-data="{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            http://127.0.0.1:8080/v1/admin/login 2>/tmp/updrill-login-headers)
          # P2 browser sign-in returns an HttpOnly session cookie, never a raw token.
          echo "$login_resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const r=JSON.parse(d);if(r.admin?.email!==process.env.ADMIN_EMAIL||!r.csrfToken||!r.stores?.length)process.exit(1)})'
          session_cookie=$(awk 'tolower($1)=="set-cookie:" && $2 ~ /^sr_admin=/ {split($2,c,";");print c[1];exit}' /tmp/updrill-login-headers)
          test -n "$session_cookie"
          me_resp=$(docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml exec -T admin wget -qO- \
            --header="Cookie: $session_cookie" http://127.0.0.1:8080/v1/admin/me)
          echo "$me_resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const r=JSON.parse(d);if(r.email!==process.env.ADMIN_EMAIL||r.isInstallationAdmin!==true)process.exit(1)})'
          echo "pre-existing admin login & authenticated installation-admin access work after upgrade"

      - name: Tear down update-drill stack
        if: always()
        working-directory: new
        run: docker compose -p sellright-updatedrill --env-file deploy/.env -f deploy/compose.yaml down -v --remove-orphans

      - name: Delete throwaway GHCR tags (best effort)
        if: always()
        continue-on-error: true
        run: |
          for component in api admin storefront; do
            for tag in "$OLD_TAG" "$NEW_TAG"; do
              version_id=$(gh api "/orgs/Orthic-Labs/packages/container/sellright-${component}/versions" \
                --jq ".[] | select(.metadata.container.tags[]? == \"${tag}\") | .id" | head -1)
              [ -n "$version_id" ] && gh api -X DELETE "/orgs/Orthic-Labs/packages/container/sellright-${component}/versions/${version_id}" || true
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
