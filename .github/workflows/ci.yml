name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core + admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/admin/pnpm-lock.yaml

      - name: Install core workspace
        run: pnpm install --frozen-lockfile

      - name: Install admin
        run: pnpm --dir packages/admin install --frozen-lockfile

      - name: Verify core and admin
        run: pnpm verify

      - name: Admin tests
        run: pnpm --dir packages/admin test

  storefront:
    name: Storefront build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/storefront/pnpm-lock.yaml

      - name: Install storefront
        run: pnpm --dir packages/storefront install --frozen-lockfile

      - name: Build storefront
        run: pnpm --dir packages/storefront build

  packaging:
    name: Production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STOREFRONT_URL: https://shop.example.net
      DOWNLOAD_URL_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      ADMIN_EMAIL: ci@example.net
      ADMIN_PASSWORD: ci-only-long-random-password-12345
      BOOTSTRAP_STORE_SLUG: ci
      BOOTSTRAP_STORE_NAME: CI Store
      BOOTSTRAP_STORE_CURRENCY: USD
      BOOTSTRAP_STORE_HOSTNAMES: shop.example.net
      SELLRIGHT_DOMAIN: sellright.example.net
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Build production images
        run: docker compose -f deploy/compose.yaml build api admin

      - name: Start database, API and admin
        run: docker compose -f deploy/compose.yaml up -d postgres api admin

      - name: Wait for proxied readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f deploy/compose.yaml exec -T admin \
              wget -qO- http://127.0.0.1:8080/v1/readyz 2>/dev/null \
              | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --no-color
          exit 1

      - name: Verify admin security headers
        run: |
          docker compose -f deploy/compose.yaml exec -T admin \
            sh -c "wget -S -O /dev/null http://127.0.0.1:8080/index.html 2>&1 | grep -qi 'Content-Security-Policy:'"

      - name: Tear down smoke stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans
