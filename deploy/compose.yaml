name: sellright

# Production images are pinned, signed GHCR references (see
# .github/workflows/ci.yml's `release` job and docs/runbooks/production-compose.md).
# Developers building from source should additionally pass
# `-f deploy/compose.yaml -f deploy/compose.build.yaml`, which overrides these
# three `image:` refs with local `build:` contexts and drops the `@sha256:...`
# digest pin so `up --build` works without a registry.
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellright
      POSTGRES_USER: sellright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellright -d sellright"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]

  # SR-01: one-shot role provisioning. The POSTGRES_USER bootstrap superuser
  # (sellright) owns schema + migrations; request serving must run as a
  # dedicated NOSUPERUSER NOBYPASSRLS role so FORCE RLS tenant isolation holds
  # at runtime. Idempotent: re-runs on every `up`, converges the role, grants,
  # and default privileges for future tables created by migrations.
  db-init:
    image: postgres:17-bookworm
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ROLE_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}
    command:
      - sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -v app_pass="$${APP_ROLE_PASSWORD}" \
          "postgresql://sellright:${POSTGRES_PASSWORD}@postgres:5432/sellright" <<'SQL'
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sellright_app') THEN
            CREATE ROLE sellright_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          END IF;
        END
        $$$$;
        ALTER ROLE sellright_app WITH LOGIN PASSWORD :'app_pass';
        GRANT CONNECT ON DATABASE sellright TO sellright_app;
        GRANT USAGE ON SCHEMA public TO sellright_app;
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sellright_app;
        GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sellright_app;
        ALTER DEFAULT PRIVILEGES FOR ROLE sellright IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sellright_app;
        ALTER DEFAULT PRIVILEGES FOR ROLE sellright IN SCHEMA public
          GRANT USAGE, SELECT ON SEQUENCES TO sellright_app;
        ALTER DEFAULT PRIVILEGES FOR ROLE sellright IN SCHEMA public
          GRANT EXECUTE ON FUNCTIONS TO sellright_app;

        -- SR-01/SR-02 follow-up: least-privilege owner for the cross-tenant
        -- SECURITY DEFINER resolver seam (resolve_store_for_gateway_event,
        -- resolve_store_for_storekit_bundle). These must see across every
        -- tenant regardless of FORCE ROW LEVEL SECURITY, but NEITHER
        -- sellright NOR sellright_app may hold BYPASSRLS (that would let
        -- ordinary migration/runtime queries bypass tenant isolation
        -- everywhere, not just inside these two functions) — so a third,
        -- NOLOGIN role holds BYPASSRLS and owns ONLY these two functions.
        -- See docs/runbooks/postgres-app-role.md "Resolver role bootstrap".
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sellright_resolver') THEN
            CREATE ROLE sellright_resolver
              NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT BYPASSRLS;
          END IF;
        END
        $$$$;
        -- has_privs_of_role(sellright, sellright_resolver) — lets sellright
        -- both take ownership below and CREATE OR REPLACE these functions in
        -- every future migration without being superuser/BYPASSRLS itself.
        GRANT sellright_resolver TO sellright WITH INHERIT TRUE;
        SQL
    networks: [private]

  api:
    image: ${SELLRIGHT_IMAGE_PREFIX:-ghcr.io/orthic-labs/sellright}-api:${SELLRIGHT_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3300
      # Runtime serves requests as the non-owner app role (NOSUPERUSER
      # NOBYPASSRLS). The privileged migration URL below is used ONLY by the
      # migrate/bootstrap steps in `command`; index.js never sees it. The API
      # asserts at boot that its runtime role is not superuser/BYPASSRLS.
      DATABASE_URL: postgresql://sellright_app:${POSTGRES_APP_PASSWORD}@postgres:5432/sellright
      DATABASE_URL_MIGRATE: postgresql://sellright:${POSTGRES_PASSWORD}@postgres:5432/sellright
      STOREFRONT_URL: ${STOREFRONT_URL:?set STOREFRONT_URL in deploy/.env}
      ASSET_DIR: /app/var/assets
      DOWNLOAD_DIR: /app/var/downloads
      # WS-E: maintenance-mode flag file. Lives on its own named volume (not
      # inside the container's writable layer) so `sellright maintenance on`
      # survives the very container restart the update sequence performs.
      MAINTENANCE_FLAG_FILE: /app/var/state/MAINTENANCE
      DOWNLOAD_URL_SECRET: ${DOWNLOAD_URL_SECRET:?set DOWNLOAD_URL_SECRET in deploy/.env}
      # WS-A's secret-crypto.ts reads this directly from process.env (it's
      # infra-only, deliberately outside the zod env schema — see that file's
      # doc comment) to encrypt/decrypt every store_secret row. It was
      # generated into deploy/.env by install.sh from day one but was never
      # actually passed through to this container — payment/email secret
      # encryption would fail closed on every real install. Fixed here as
      # part of WS-B's recovery-kit endpoint, which needs the same variable.
      SELLRIGHT_MASTER_KEY: ${SELLRIGHT_MASTER_KEY:?set SELLRIGHT_MASTER_KEY in deploy/.env}
      # Recovery kit (plan §1.10): the kit file install.sh writes to disk is
      # reconstructible entirely from env the api container already has
      # (SELLRIGHT_MASTER_KEY + this id), so GET /v1/admin/system/recovery-kit
      # never needs filesystem access to $SELLRIGHT_HOME.
      RECOVERY_KIT_ID: ${RECOVERY_KIT_ID:-}
      # One-click install (WS-B): a fresh install.sh run no longer writes
      # these — the owner claims the install in the browser via
      # `sellright setup-link` + POST /v1/setup/claim instead (dist/scripts/
      # bootstrap.js is a no-op without BOOTSTRAP_STORE_SLUG). Left optional,
      # not required, so an existing env-based deployment that still sets all
      # three in deploy/.env keeps bootstrapping exactly as before.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BOOTSTRAP_STORE_SLUG: ${BOOTSTRAP_STORE_SLUG:-}
      BOOTSTRAP_STORE_NAME: ${BOOTSTRAP_STORE_NAME:-}
      BOOTSTRAP_STORE_CURRENCY: ${BOOTSTRAP_STORE_CURRENCY:-USD}
      BOOTSTRAP_STORE_HOSTNAMES: ${BOOTSTRAP_STORE_HOSTNAMES:-}
      FUNCTIONAL_CHECK_STORE_SLUG: ${FUNCTIONAL_CHECK_STORE_SLUG:-}
      # Test/CI-only escape hatch (see packages/api/src/env.ts) to deterministically
      # fail `sellright functional-check` without a real broken migration —
      # never set this in a real deployment's .env.
      FUNCTIONAL_CHECK_FORCE_FAIL: ${FUNCTIONAL_CHECK_FORCE_FAIL:-}
      STRIPE_SECRET_KEY_TEST: ${STRIPE_SECRET_KEY_TEST:-}
      STRIPE_PUBLISHABLE_KEY_TEST: ${STRIPE_PUBLISHABLE_KEY_TEST:-}
      STRIPE_WEBHOOK_SECRET_TEST: ${STRIPE_WEBHOOK_SECRET_TEST:-}
      STRIPE_SECRET_KEY_LIVE: ${STRIPE_SECRET_KEY_LIVE:-}
      STRIPE_PUBLISHABLE_KEY_LIVE: ${STRIPE_PUBLISHABLE_KEY_LIVE:-}
      STRIPE_WEBHOOK_SECRET_LIVE: ${STRIPE_WEBHOOK_SECRET_LIVE:-}
      GATEWAY_ACCOUNTS_JSON_FILE: /run/secrets/gateway_accounts
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-1}
      JOBS_PUSH_ENABLED: ${JOBS_PUSH_ENABLED:-0}
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-0}
      TRUSTED_PROXY_HEADER: x-real-ip
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      PGPOOL_CONNECTION_TIMEOUT_MS: ${PGPOOL_CONNECTION_TIMEOUT_MS:-5000}
    volumes:
      - assets:/app/var/assets
      - downloads:/app/var/downloads
      - state:/app/var/state
    secrets:
      - gateway_accounts
    networks: [private]
    # Same lifecycle as the Dockerfile CMD, but schema migrations and the
    # create-only bootstrap run as the privileged migration role while the
    # request-serving process keeps the non-owner DATABASE_URL.
    command:
      - sh
      - -c
      - |
        DATABASE_URL="$${DATABASE_URL_MIGRATE}" node dist/scripts/migrate.js &&
        DATABASE_URL="$${DATABASE_URL_MIGRATE}" node dist/scripts/bootstrap.js &&
        exec node dist/index.js

  admin:
    image: ${SELLRIGHT_IMAGE_PREFIX:-ghcr.io/orthic-labs/sellright}-admin:${SELLRIGHT_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:3300
    volumes:
      - assets:/assets:ro
    networks: [private]

  # WS-C landed a generic runtime-config image: no store identity/theme is
  # baked in, it resolves per-request Host via GET /v1/shop/identity against
  # SELLRIGHT_API_URL below. Not exposed publicly unless
  # SELLRIGHT_STOREFRONT_DOMAIN is set (see Caddyfile) — still true today
  # because Caddy has no per-Host store routing of its own yet; the storefront
  # container itself already supports serving multiple stores from one image.
  storefront:
    image: ${SELLRIGHT_IMAGE_PREFIX:-ghcr.io/orthic-labs/sellright}-storefront:${SELLRIGHT_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SELLRIGHT_API_URL: ${SELLRIGHT_API_URL:-http://api:3300}
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      storefront:
        condition: service_healthy
    environment:
      SELLRIGHT_DOMAIN: ${SELLRIGHT_DOMAIN:?set SELLRIGHT_DOMAIN in deploy/.env}
      SELLRIGHT_STOREFRONT_DOMAIN: ${SELLRIGHT_STOREFRONT_DOMAIN:-:8090}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]

volumes:
  postgres_data:
  assets:
  downloads:
  state:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge

secrets:
  gateway_accounts:
    file: ${GATEWAY_ACCOUNTS_FILE:-./gateway-accounts.json}
