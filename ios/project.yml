# SellRight Admin (iPhone + iPad): dashboard, orders, products, customers, push + Live Activity.
# Generated project is XcodeGen output (gitignored): cd ios && xcodegen generate
# Ships to TestFlight through RightKit's shared iOS recipe (targets.ios in right-release.config.mjs).
# RightKitSwift pin: git URL at the released tag, never a path dep (docs/RIGHTKIT-SHARED-PACKAGES.md).
name: SellRightAdmin
options:
  bundleIdPrefix: app.sellright
  deploymentTarget:
    # Live Activity push-to-start needs 17.2; the floor follows the other Orthic apps (Pulse) at 18.0
    # for the TabView Tab API and the sidebar-adaptable iPad layout.
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: "NO"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6KLGD3LLKF
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RightKitSwift:
    url: https://github.com/bogusyogi/rightkit
    exactVersion: "0.8.1"
targets:
  SellRightAdmin:
    type: application
    platform: iOS
    sources:
      - path: SellRightAdmin
      - path: Shared
    dependencies:
      - package: RightKitSwift
        product: RightKitDiagnostics
      # Session token in the Keychain (SecretsStore), the same owner every Orthic app uses.
      - package: RightKitSwift
        product: RightKitCredentials
      # Liquid Glass with the shared accessibility and older-OS fallback.
      - package: RightKitSwift
        product: RightKitUI
      - target: SellRightWidgets
    info:
      path: SellRightAdmin/Info.plist
      properties:
        CFBundleDisplayName: SellRight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # The order Live Activity (lock screen + Dynamic Island) needs this on the app, not only the widget.
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad multitasking requires every orientation (App Store validation rejects an iPad build without them).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dev convenience only: allows http://localhost / LAN dev servers.
        # Production builds talk to https and this exception never applies.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SellRightAdmin/SellRightAdmin.entitlements
      properties:
        # Password AutoFill: iOS fetches /.well-known/apple-app-site-association
        # from these domains to offer saved admin credentials on the login form.
        # Release/TestFlight builds use ONLY the plain entries, fetched through Apple's
        # CDN (Orthic-Labs/sellright#343: every entry was ?mode=developer, so autofill
        # never worked outside dev builds). ?mode=developer entries are read only by
        # dev-signed builds on Developer Mode devices, straight from the host.
        # admin.sellright.cc stays dev-only: it sits behind Cloudflare Access, so
        # Apple's CDN can't fetch it (#331 keeps it until the alias retires).
        com.apple.developer.associated-domains:
          - webcredentials:admin.orthiclabs.com
          - webcredentials:api.orthiclabs.com
          - webcredentials:admin.orthiclabs.com?mode=developer
          - webcredentials:api.orthiclabs.com?mode=developer
          - webcredentials:admin.sellright.cc?mode=developer
        # 'development' routes to the APNs SANDBOX host, which is what a
        # Debug/dev-signed build's token is valid for. The App Store Connect export
        # signs TestFlight/App Store builds with 'production' (see docs/IOS-PUSH-SETUP.md);
        # the app reports its own environment at registration so the server picks
        # the matching APNs host either way.
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: SellRightAdmin
        PRODUCT_BUNDLE_IDENTIFIER: app.sellright.ios.admin
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SellRightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SellRightWidgets
      - path: Shared
    info:
      path: SellRightWidgets/Info.plist
      properties:
        CFBundleDisplayName: SellRight
        # The recipe requires one version identity across the app and every extension.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: SellRightWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.sellright.ios.admin.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"

  SellRightAdminTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SellRightAdmin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.sellright.ios.admin.tests
schemes:
  SellRightAdmin:
    build:
      targets:
        SellRightAdmin: all
        SellRightAdminTests: [test]
    test:
      targets:
        - SellRightAdminTests
