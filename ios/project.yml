name: SellRightAdmin
options:
  bundleIdPrefix: app.sellright
  deploymentTarget:
    # 17.2 (not 17.0) is the floor for Live Activity push-to-start: starting an
    # activity from a server push, rather than only from the foreground app,
    # arrived in 17.2. Without it a new order could never light up the Dynamic
    # Island unless the operator already had the app open — which defeats it.
    iOS: "17.2"
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: "NO"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6KLGD3LLKF
packages:
  RightKitSwift:
    url: https://github.com/bogusyogi/rightkit-swift
    from: 0.1.0
targets:
  SellRightAdmin:
    type: application
    platform: iOS
    sources:
      - path: SellRightAdmin
      - path: Shared
    dependencies:
      - package: RightKitSwift
        products:
          - RightKitDiagnostics
      - target: SellRightWidgets
    info:
      path: SellRightAdmin/Info.plist
      properties:
        CFBundleDisplayName: SellRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dev convenience only: allows http://localhost / LAN dev servers.
        # Production builds talk to https and this exception never applies.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SellRightAdmin/SellRightAdmin.entitlements
      properties:
        # Password AutoFill: iOS fetches /.well-known/apple-app-site-association
        # from these domains to offer saved admin credentials on the login form.
        # ?mode=developer applies to dev-signed builds on Developer Mode devices;
        # release builds need the plain entries + Apple CDN visibility.
        com.apple.developer.associated-domains:
          - webcredentials:api.spoares.com?mode=developer
          - webcredentials:admin.spoares.com?mode=developer
        # 'development' routes to the APNs SANDBOX host, which is what a
        # Debug/dev-signed build's token is valid for. TestFlight/App Store
        # builds need this flipped to 'production' (see docs/IOS-PUSH-SETUP.md);
        # the app reports its own environment at registration so the server picks
        # the matching APNs host either way.
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: SellRightAdmin
        PRODUCT_BUNDLE_IDENTIFIER: app.sellright.ios.admin
        TARGETED_DEVICE_FAMILY: "1,2"
  SellRightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SellRightWidgets
      - path: Shared
    info:
      path: SellRightWidgets/Info.plist
      properties:
        CFBundleDisplayName: SellRight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: SellRightWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.sellright.ios.admin.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"

  SellRightAdminTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SellRightAdmin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  SellRightAdmin:
    build:
      targets:
        SellRightAdmin: all
        SellRightAdminTests: [test]
    test:
      targets:
        - SellRightAdminTests
