packages:
  - "."

# Supply-chain hardening (ra-017). Mirrors the root pnpm-workspace.yaml so every
# package workspace opts in to the same defense-in-depth defaults. See the
# root pnpm-workspace.yaml for why trustPolicy + minimumReleaseAge are
# deferred — the existing lockfile needs to be rebuilt first.
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  esbuild: 0.28.1
  launch-editor: 2.14.1
  # Security floors for transitive Qwik/Vite dependencies.
  # GHSA-r28c-9q8g-f849 / GHSA-fxqj-rqcc-2cmp.
  postcss: ^8.5.23
  # GHSA-2v37-7h3g-55p8.
  nanoid: ^3.3.18
  # GHSA-395f-4hp3-45gv.
  shell-quote: 1.10.0
  uuid: 11.1.1
