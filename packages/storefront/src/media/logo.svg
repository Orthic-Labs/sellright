<?xml version="1.0" encoding="UTF-8"?>
<!-- Neutral placeholder mark for the demo storefront theme — icon only, no
     baked-in wordmark (the store name renders as real text next to it in
     header.tsx so it's never clipped and always matches theme.storeName).
     Uses currentColor so it inherits the header's text color. Swap this file
     (or import a brand's own SVG) to rebrand the header logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-hidden="true">
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="none" stroke="currentColor" stroke-width="1.6" />
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" />
  <circle cx="16" cy="16" r="2" fill="currentColor" />
</svg>
