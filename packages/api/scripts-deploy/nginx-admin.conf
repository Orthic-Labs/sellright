# /etc/nginx/sites-available/sellright-admin.conf — installed by `sudo ln -s`
# then `sudo nginx -t && sudo systemctl reload nginx`. One vhost per brand
# (admin.rottenhand.com, admin.damned.com, ...); symlink + edit the server_name.
#
# Cloudflare Access sits in front (same as the legacy Vendure admin). The
# upstream is the API on :3300 for /v1/; everything else is the built admin SPA.
#
# Build the admin first: `cd packages/admin && pnpm build` — output goes to
# packages/admin/dist, which this vhost serves.

server {
    listen 443 ssl;
    http2 on;
    server_name admin.rottenhand.com;   # edit per brand

    ssl_certificate     /etc/letsencrypt/live/rottenhand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rottenhand.com/privkey.pem;

    root /home/vendure/sites/sellright/packages/admin/dist;
    index index.html;

    # Long-cache hashed assets; index.html must be revalidated.
    # Security headers (DISPATCH FE-7) are emitted on EVERY response so they
    # apply to /, /assets/, hashed JS/CSS, and the SPA fallback alike.
    # `always` is required because `add_header` on a static-location only
    # fires for 200/206/304, not for the SPA index.html fallback — which is
    # the entry point we most want CSP on.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /assets/ {
        alias /home/vendure/sites/sellright-assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — preserves client IP via X-Real-IP (our priority after
    # cf-connecting-ip, which Cloudflare sets at the edge).
    location /v1/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — every non-asset path serves index.html so client-side
    # routing works.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
