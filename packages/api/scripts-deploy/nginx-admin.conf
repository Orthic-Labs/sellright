# /etc/nginx/sites-available/sellright-admin.conf — installed by `sudo ln -s`
# then `sudo nginx -t && sudo systemctl reload nginx`. One vhost per brand
# (admin.rottenhand.com, admin.damned.com, ...); symlink + edit the server_name.
#
# Cloudflare Access sits in front (same as the legacy Vendure admin). The
# upstream is the API on :3300 for /v1/; everything else is the built admin SPA.
#
# Build the admin first: `cd packages/admin && pnpm build` — output goes to
# packages/admin/dist, which this vhost serves.

server {
    listen 443 ssl;
    http2 on;
    server_name admin.rottenhand.com;   # edit per brand

    ssl_certificate     /etc/letsencrypt/live/rottenhand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rottenhand.com/privkey.pem;

    root /home/vendure/sites/sellright/packages/admin/dist;
    index index.html;

    # Long-cache hashed assets; index.html must be revalidated.
    location /assets/ {
        alias /home/vendure/sites/sellright-assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — preserves client IP via X-Real-IP (our priority after
    # cf-connecting-ip, which Cloudflare sets at the edge).
    location /v1/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — every non-asset path serves index.html so client-side
    # routing works.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
