# Right Apps SellRight instance — public vhosts.
#   admin.spoares.com  -> admin SPA (packages/admin/dist, mounted) + /v1 proxy
#   api.spoares.com    -> the API (desktop apps, storefronts, Stripe webhooks)
# Backend: PM2 `rightapps-api` on the HOST at 172.22.0.1:3301
#   (172.22.0.1 = docker bridge gateway; nginx runs in the nginx-brotli container,
#    so 127.0.0.1 would be the container itself — must use the host gateway IP).
# TLS: /etc/letsencrypt/live/spoares.com/ — expand that cert to add these 2 SANs:
#   sudo certbot certonly --webroot -w /home/vendure/sites/nginx/webroot \
#     --cert-name spoares.com --expand \
#     -d spoares.com -d listmonk.spoares.com -d n8n.spoares.com \
#     -d admin.spoares.com -d api.spoares.com
# Deploy: add COPY to the Dockerfile, mount the admin dist in docker-compose.yml,
#   then `cd ~/sites/nginx && docker compose build && docker compose up -d`.

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.spoares.com api.spoares.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

# ---- api.spoares.com — full API surface ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.spoares.com;

    ssl_certificate     /etc/letsencrypt/live/spoares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoares.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare real client IP (so the API's cf-connecting-ip rate limiting works)
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;  set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22; set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;   # admin asset uploads
    access_log /var/log/nginx/rightapps-api_access.log;
    error_log  /var/log/nginx/rightapps-api_error.log warn;

    # Everything proxies to the rightapps API. The Stripe webhook
    # (/v1/webhooks/stripe) needs the raw body for signature verification — Hono
    # reads it via c.req.text(); nginx passes the body through untouched.
    location / {
        proxy_pass http://172.22.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---- admin.spoares.com — admin SPA + /v1 proxy ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.spoares.com;

    ssl_certificate     /etc/letsencrypt/live/spoares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoares.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;  set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22; set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The admin SPA build (packages/admin/dist) mounted ro into the container at
    # /var/www/rightapps-admin (see docker-compose.yml volumes).
    root /var/www/rightapps-admin;
    index index.html;

    client_max_body_size 50m;
    access_log /var/log/nginx/rightapps-admin_access.log;
    error_log  /var/log/nginx/rightapps-admin_error.log warn;

    location /v1/ {
        proxy_pass http://172.22.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
