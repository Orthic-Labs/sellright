packages:
  - "."

# Supply-chain hardening (ra-017). Mirrors the root pnpm-workspace.yaml so every
# package workspace opts in to the same defense-in-depth defaults. See the
# root pnpm-workspace.yaml for why trustPolicy + minimumReleaseAge are
# deferred — the existing lockfile needs to be rebuilt first.
blockExoticSubdeps: true

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

overrides:
  # Keep Vitest and its mocker aligned on patched 5.0.5.
  vitest: 5.0.5
  '@vitest/mocker': 5.0.5
  esbuild: 0.28.2
  # @tiptap/react optionally pulls these with ^3.31.3; keep them aligned with
  # current @tiptap/* dependencies to satisfy core and pm peer requirements.
  '@tiptap/extension-bubble-menu': 3.32.0
  '@tiptap/extension-floating-menu': 3.32.0

minimumReleaseAgeExclude:
  - lucide-react@1.55.0
