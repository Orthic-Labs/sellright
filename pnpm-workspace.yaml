packages:
  - "packages/*"
  # admin is a standalone React+Vite SPA with its own lockfile/toolchain; it
  # installs independently so its React deps can't disturb the api/shared build.
  - "!packages/admin"

# Supply-chain hardening (ra-017). pnpm 10 settings: refuse to install packages
# from non-trusted registries or via exotic transitive sources. The other two
# candidates (minimumReleaseAge, trustPolicy: no-downgrade) would block the
# existing lockfile (`semver@6.3.1` flags a trust-downgrade; several packages
# were published within the last 7 days). Land those settings as a follow-up
# once the lockfile is rebuilt from a clean state â€” add them here AND in
# packages/admin/pnpm-workspace.yaml. The blockExoticSubdeps knob
# already blocks packages from registries outside the trusted allowlist, which
# is the highest-value supply-chain defense and works against the current
# lockfile.
#   https://pnpm.io/settings#blockexoticsubdeps
#   https://pnpm.io/settings#trustpolicy
#   https://pnpm.io/settings#minimumreleaseage
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  # GHSA-82fw-gwwq-j7x9: keep the test runner and its mocker on the patched release.
  vitest: 4.1.11
  '@vitest/mocker': 4.1.11
  esbuild: 0.28.1
  # GHSA-r28c-9q8g-f849 (path traversal) â€” postcss is pulled in transitively
  # (sanitize-html) as well as directly by admin; force >= 8.5.18
  # workspace-wide rather than editing each package.json.
  postcss: ^8.5.18
  # GHSA-2v37-7h3g-55p8 — sanitize-html/postcss permits vulnerable nanoid 3.x.
  nanoid: ^3.3.18
  # brace-expansion via @typescript-eslint devDependency â€” fix >= 5.0.8.
  brace-expansion: ^5.0.8
  # GHSA-w5hq-g745-h8pq — exceljs pins uuid <11.1.1; 11.x keeps the CJS build exceljs requires.
  uuid: ^11.1.1
  # GHSA-f88m-g3jw-g9cj / GHSA-rgj7-g3m4-5g8c / GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545 —
  # @sellright/storefront's own sharp is already >=0.35.4 (patched), but moving
  # @qwik.dev/router into storefront's `dependencies` (WS-D, so the SSR server
  # image's production install actually includes it) pulls its transitive
  # vite-imagetools -> sharp<0.35 into `pnpm audit --prod` scope as a separate,
  # older resolution. Force every sharp in the tree to the patched version
  # instead of only the direct one.
  sharp: ^0.35.4
