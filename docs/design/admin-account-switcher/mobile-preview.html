<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SellRight admin · mobile viewport previews</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1ed;color:#17211b;font:14px system-ui,sans-serif}.previews{display:flex;align-items:flex-start;gap:24px;padding:18px;overflow:auto}.preview{flex:none}.label{font:600 13px system-ui,sans-serif;margin:0 0 8px}.frame{display:block;border:1px solid #9da99f;background:#fff;border-radius:8px;width:390px;height:850px}.frame.narrow{width:320px}
</style>
</head>
<body>
<main class="previews">
  <section class="preview" aria-label="390 pixel viewport">
    <h1 class="label">390 px viewport</h1>
    <iframe class="frame" src="design.html" title="SellRight admin prototype at 390 pixels"></iframe>
  </section>
  <section class="preview" aria-label="320 pixel viewport">
    <h2 class="label">320 px viewport</h2>
    <iframe class="frame narrow" src="design.html" title="SellRight admin prototype at 320 pixels"></iframe>
  </section>
</main>
</body>
</html>
